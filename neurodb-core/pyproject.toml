[project]
name = "neurodb-core"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "aezyus", email = "aezyus1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "av>=13.0",
    "fastapi>=0.141.1",
    "faster-whisper>=1.0",
    "google-genai>=1.0",
    "numpy>=2.5.1",
    "pillow>=11.0.0",
    "pyarrow>=25.0.0",
    "pydantic>=2.13.4",
    "pyjwt>=2.13.0",
    "pypdf>=6.14.2",
    "python-dotenv>=1.2.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.52.1",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
